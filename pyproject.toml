[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traficFines"
version = "0.1.0"
description = "Descarga, limpieza y análisis de las multas de circulación del Ayuntamiento de Madrid"
readme = "README.md"
authors = [{ name = "Brigitta Zolotovitskaia" }]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
    "beautifulsoup4",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.setuptools]
packages = ["traficFines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
